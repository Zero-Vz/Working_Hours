name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 arm64-v8a Release APK
    runs-on: ubuntu-latest

    steps:
      # 以下三个 action 均已运行在 Node.js 24 上，不再触发
      # “Node.js 20 is deprecated” 与 “setup-java v4 is deprecated” 警告。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/Working_Hours-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/Working_Hours-armeabi-v7a-release.apk
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: working-hours-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
