name: working_hours
description: 记工时 - 纯离线的加班工时记录、统计与导出应用（Material 3 / Riverpod / Hive / fl_chart）。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 本地数据库（离线优先）
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 图表
  fl_chart: ^0.68.0

  # 日期格式化
  intl: ^0.19.0

  # CSV 导出 / 导入
  csv: ^6.0.0

  # 分享导出文件
  share_plus: '>=10.0.0 <11.0.0'

  # 临时文件目录
  path_provider: ^2.1.4

  # 选择本地 CSV 文件（Android 使用系统文件选择器，无需存储权限）
  file_picker: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
